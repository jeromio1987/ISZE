<style>

.chip{font-size:13px;padding:5px 10px}
.time{color:var(--muted);min-width:90px;text-align:right}
.note{color:var(--muted);font-size:12.5px;margin-top:10px;max-width:980px}
body.rec .ctl,body.rec .chips,body.rec .note{display:none}
body.rec .wrap{padding:0;max-width:none}
body.rec #stage{border-radius:0}

<script>
(function(){

function clamp(x){return x<0?0:x>1?1:x}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function R(x,y,w,h,f,op,rx){return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(w,0).toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" fill="'+f+'" opacity="'+(op==null?1:op)+'" rx="'+(rx||0)+'"/>'}

/* ---------- scene 1 */
function s1(t){

/* ---------- scene 2 */

function bonus(g,p,lv){var b1=p.l1,b2=p.l2,r=lv==1?p.r1:p.r2,flat=lv==1?p.f1:p.f2;if(g<=0)return flat;

  var X0=110,X1=1160,Y0=560,Y1=170,gmin=-0.10,gmax=0.20,rmax=0.07;

  var prog=seg(t,1.5,10);var gcut=gmin+(gmax-gmin)*prog;
  function curve(fn,col,w,lab,lx,ly,step,anc){var p='',first=true;for(var k=0;k<=300;k++){var g3=gmin+(gmax-gmin)*k/300;if(g3>gcut)break;var y=py(fn(g3));if(step&&k>0){}p+=(first?'M ':' L ')+px(g3).toFixed(1)+' '+y.toFixed(1);first=false}

var FN=[s1,s2,s3,s4,s5,s6,s7];
var stage=document.getElementById('stage');
function render(t){
  t=Math.max(0,Math.min(TOTAL,t));var i=sceneIdx(t),sc=SCENES[i],lt=t-sc[0];
  var o='<rect width="1280" height="720" fill="'+C.bg+'"/>'+FN[i](lt);
  // scene progress line
  o+=R(0,716,1280*t/TOTAL,4,C.red,1);
  stage.innerHTML=o;
  var m=Math.floor(t/60),s=Math.floor(t%60);document.getElementById('time').textContent=m+':'+(s<10?'0':'')+s+' / 1:30';
  document.getElementById('scrub').value=t;
  var ch=document.querySelectorAll('.chip');for(var k=0;k<ch.length;k++){ch[k].style.borderColor=k===i?C.red:'#444b52'}
}
window.__render=render;
var q=new URLSearchParams(location.search);
if(q.get('rec')){document.body.classList.add('rec')}
var chips=document.getElementById('chips');
SCENES.forEach(function(sc,i){var b=document.createElement('button');b.className='chip';b.textContent=sc[2];b.onclick=function(){t=sc[0];render(t)};chips.appendChild(b)});
var t=q.get('t')?parseFloat(q.get('t')):0,playing=!q.get('t'),last=null;
function loop(ts){if(playing){if(last!=null){t+=(ts-last)/1000;if(t>=TOTAL){t=TOTAL;playing=false;document.getElementById('play').textContent='Play again'}}render(t)}last=ts;requestAnimationFrame(loop)}
document.getElementById('play').onclick=function(){if(t>=TOTAL){t=0}playing=!playing;this.textContent=playing?'Pause':'Play'};
document.getElementById('restart').onclick=function(){t=0;playing=true;document.getElementById('play').textContent='Pause';render(0)};
document.getElementById('scrub').oninput=function(){t=parseFloat(this.value);render(t)};
render(t);requestAnimationFrame(loop);
})();
</script></body></html>
