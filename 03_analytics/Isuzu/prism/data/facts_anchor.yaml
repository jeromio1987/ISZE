# FACTS anchor — machine-readable companion to ISZE\FACTS.md
# ============================================================
# Each entry pins a FACTS.md headline figure to a metrics_snapshot.json key.
# verify_facts_drift.py recomputes the snapshot side and FAILS on |drift| > tol.
# When the pipeline legitimately changes a number: update FACTS.md AND this
# anchor in the same commit — that is the reconcile step, enforced not manual.
#
# Seeded 2026-06-10 from metrics_snapshot.json (pipeline verify 96/0, 2026-06-04).

anchors:
