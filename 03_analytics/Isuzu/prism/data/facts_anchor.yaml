  # RISES. Verified: 30,756,771.61 / 54,375,729 = 56.56%. Stale, not wrong: no market was an
  # arithmetic error against the code of 2026-09-17.
  # 2026-09-24: 56.6 -> 56.5. Malta and Cyprus 3.5 t shares corrected to 0 (their NMR is the 5.5 t N55, not an
  # N35), so their trucks are priced at the EUR 739 rate: wallet 54,375,729 -> 54,420,472 (+39,870 Malta,
  # +4,873 Cyprus). Parts billed unchanged. Verified: 30,756,771.61 / 54,420,472 = 56.52%.
