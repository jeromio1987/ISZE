  # 40.2 (seeded 2026-06-10) included MIDI's ~EUR15M theoretical wallet with zero
  # ISZE-direct sales; MIDI excluded from GPS/Projection per Jerome decision —
  # first drift-checked run after the 2026-06-18 UIO refresh re-based it to 50.2.
  # 2026-07-03: 50.2 -> 51.1. Wallet unchanged (EUR60.22M, same UIO/targets);
  # captured_total_eur rose EUR30.20M -> EUR30.76M from the more-complete 2025
  # re-export (CY2024-2025.XLSX), partially offset by CR/RE exclusion
  # (~EUR509K removed from 2025). Verified: 30,756,771.61 / 60,217,570 = 51.08%.
  # 2026-09-17: 51.1 -> 55.7. THE WALLET MOVED, not the capture. ITUK's collapsed "LD" UIO
  # row was being priced entirely at the N75 rate (EUR739) when 10,900 of its trucks are N35
  # (EUR296). Splitting them — data_prep._split_collapsed_ld_rows, reading the workbook's own
