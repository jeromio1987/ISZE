  # (not a bug): (1) sales_fact widened from 434,858 to 477,505 rows (added
  # CY2024-2025.XLSX's more-complete 2025 re-export + sales_2026tillApril.XLSX,
  # Jan-Mar 2026 — closes the FY2025-completeness gap); (2) SaTy CR/RE
  # credit-note/return lines (280 rows, EUR1.65M network-wide) now excluded from
  # revenue-bearing metrics for the first time (flag H). Net effect is additive
  # since the new 2026 quarter (~EUR10M gross) outweighs the CR/RE removal.
  - key: sales.parts_base_eur
    facts_value: 103573715
    tol_pct: 0.5
    facts_ref: "FACTS.md section 4 - parts base (2023-2026, ex-credit-notes/returns)"

