# Golden checks for ISZE derived pipeline (2026-05-15 baseline; refreshed 2026-07-03).
# Update after intentional data refreshes; verifier reads this file.

# 2026-07-03: added CY2024-2025.XLSX (more-complete 2025 re-export, supersedes
# CY2025.XLSX) + sales_2026tillApril.XLSX (Jan-Mar 2026, closes the FY2025
# completeness gap). 434,858 -> 477,505 rows. See build_sales_fact_from_cy.py
# CY_FILE_YEARS for the year-ownership rule that avoids double-counting 2024.
# 2026-08-25: Q1FY2027.XLSX (Apr–Jun 2026) wired; 477,505 -> 514,037 rows.
# Q1FY2027 extract has no SaTy column → overall SaTy coverage ~92.9%.
sales_fact:
  row_count: 514037
  row_tolerance_pct: 0.5
  years: [2023, 2024, 2025, 2026]
  max_unmapped_pct: 1.0

bvp_pn_dimension:
  min_rows: 500
  min_pms_flagged: 50
  line_types: [genuine, bvp]

genuine_bvp_crossref:
  min_rows: 200
  min_catalog_pairs: 150
  pair_sources: [catalog_paired, catalog_continuation, registry_model_category]

gps_spu_warranty:
  warranty_year: 2025
  min_dbs_with_warranty: 17
  required_columns:
    - warranty_parts_eur
    - sales_ex_warranty_eur
    - spend_per_unit_ex_warranty_eur
    - gps_capture_ex_warranty_vs_max
    - traffic_light_v9_ex_warranty

pms_summary_by_db:
  min_distributors: 18
  required_columns:
    - distributor_code
    - capture_rate_total_wtd
    - oil_filter_capture
    - revenue_gap_eur_sum

pms_capture:
  min_rows: 100
  line_types: [genuine, bvp, total]
  min_distributors: 18
  # ITUK (and peers) sell PMS to non-Isuzu parc (e.g. DAF) and multi-segment PNs;
  # uncapped capture can exceed 100% vs Isuzu UIO denominator — not a data bug.
  # Catalog-wide actuals push small markets high (e.g. DEN oil_filter); cap is sanity only.
  capture_rate_max: 10.00

ituk_pilot:
  distributor_code: ITUK
  # PRISM lane (2026-07-15): bucketed model split cv_std+f_series = 23068
  # (NOT IML v7 DVLA 22389 — that stays in iml_v7_ituk_cy2025.yaml / FACTS §1).
  uio_units: 23068
  uio_tolerance: 0
  # UIO × 0.5 svc/yr × 100% addressable (Jerome 2026-07-03).
  # Actuals = registry + BVP-catalog PMS PNs (incl. multi-model + cross-OEM) — do not strip sales.
  #
  # RE-BASED 2026-09-18 for the N35 / N75 interval split. N35 (NLR87 RZ4E) runs a 20,000 km factory
  # interval and N75 (NPR75 4HK1) runs 40,000, so the blended cv_std rate for ITUK becomes
  # 0.5 × (1 + 0.5051) = 0.7526 rather than a flat 0.5. Expected demand rises ~50% and the capture
  # bands move DOWN accordingly.
  #
  # Scope note, because two lanes exist and this band governs only one of them:
  #   * THIS band governs the PRISM lane (pms_capture_by_db_year.csv) only.
  #   * The IML v7 lane (iml_v7_ituk_cy2025.yaml, oil-filter cover 35.1%, the externally published
  #     deck) is NOT covered and is NOT changed.
  # The two were already different by design (IML 35.1% vs PRISM 116.4%), so this correction does not
  # create a divergence — it corrects the internal lane while leaving the agreed external one alone.
  # NOTE: 35.1% is the IML v7 figure and is NOT this band. A PRISM-lane value of 35.1% would be a
  # coincidence, so these bands are set from the measured PRISM-lane output (2024 56.4%, 2025 78.7%).
  # Bands widened to +/-5% to absorb the fractional N35 split inherited from section 2.B.
  oil_filter_total_capture:
    "2024":
      min: 0.52
      max: 0.61
    "2025":
      min: 0.74
      max: 0.84

required_derived:
  - sales_fact.parquet
  - bvp_pn_dimension.csv
  - genuine_bvp_crossref.csv
  - sales_with_crossref.parquet
  - substitution_by_pair_year.csv
  - substitution_by_db_year.csv
  - pms_capture_by_db_year.csv
  - mix_genuine_bvp_by_family.csv
  - mix_genuine_bvp_pms.csv
  - db_benchmark_mix.csv
  - gps_spu_by_distributor.csv
  - pms_summary_by_db.csv
  - gps_spu_by_family.csv
  - gps_spu_pms.csv
  - aim_exposure_by_db_year.csv
  - aim_bvp_family_risk.csv
  - pms_opportunity_matrix.csv
  - network_percentile.csv
  - vor_airfreight_risk.csv
  - vor_seasonality.csv
  - vor_profile.csv
  - capture_trajectory.csv
  - part_lifecycle.csv
  - revenue_concentration.csv
  - revenue_waterfall.csv
  - price_premium.csv
  - basket_correlation.csv
  - substitution_timeline.csv
  - capture_recovery_model.csv
  - bvp_addressable_basket.csv
  - ituk_pms_pn_audit.csv
  - parts_catalog_dimension.csv
  - sales_by_db_fig_key_year.csv
  - aim_gps_matrix.csv
  - lost_sales_model.csv
  - lost_sales_market.csv
  - lost_sales_competitor_pn.csv
  - lost_sales_competitor_coverage.csv

uio_by_market_type_year:
  # The fleet year axis. 2025 column must reproduce the derived fleet split the spend model
  # reads; 1990-2024 is the actual range and must carry no gap or negative inside it.
  required_columns: [distributor_code, market, vehicle_class, model_type, year, uio_units,
                     is_actual, is_estimate, is_forecast, basis, source_note]
  estimate_year: 2025
  actual_through: 2024
  # A gap from this year onward is a failure; an older hole is a named warning. The Denmark
  # light-commercial row has no 2012-2013 in the workbook itself; nothing this rebuild divides by
  # reaches back that far, and the hole is reported rather than filled.
  hard_gap_from_year: 2023
  reconcile_tolerance_units: 0.5

aim_gps_matrix:
  min_rows: 50
  # 2026-07-17: AIM pricing-risk axis retired — see DECISIONS.md
  quadrants: [defend, priority_target, attach_gap, wallet_gap, insufficient_data]

bvp_addressable_basket:
  min_rows: 1500
  required_columns: [distributor_code, genuine_pn, bvp_pn, product_subgroup, currently_selling_bvp]
  min_distinct_distributors: 20
  min_distinct_subgroups: 22

sales_fact_saty:
  required_column: saty
  # Floor lowered 2026-08-25: Q1FY2027.XLSX (Apr–Jun) has no SaTy column.
  # Pre-Apr-2026 rows remain ~100% SaTy. Ask SAP for SaTy on next FY extract.
  min_non_null_pct: 92.0

# fig_key on sales_fact: SAP export column when present, else parts_catalog_dimension
# join at build time (2026-07-02). Floor set below observed sales-weighted coverage.
sales_fact_fig_key:
  min_non_null_pct: 90.0

pms_opportunity_matrix:
  min_rows: 200
  capture_rate_max: 10.00
  tam_eur_min: 1.0

network_percentile:
  min_rows: 200
  metrics: [gps_spu, total_capture, genuine_capture, bvp_mix, aim_risk]
  percentile_range: [0, 100]

vor_airfreight_risk:
  min_rows: 50

vor_seasonality:
  min_rows: 100

vor_profile:
  min_rows: 50

capture_trajectory:
  min_rows: 200
  projected_years: [2026, 2027]
  r2_range: [0, 1]

part_lifecycle:
  min_rows: 300
  lifecycle_stages: [emerging, growing, mature, declining, zombie]

revenue_concentration:
  min_rows: 100
  gini_range: [0, 1]

revenue_waterfall:
  min_rows: 50

price_premium:
  min_rows: 30
  price_premium_range: [-0.5, 10.0]

basket_correlation:
  min_rows: 30
  correlation_range: [-1, 1]

substitution_timeline:
  min_rows: 100

capture_recovery_model:
  min_rows: 50
  gap_types: [substitution, under_service, catalog_gap]

# Lost-sales model (2026-09-18). Ties out to the parts base and to the existing strategic
# contracts, so a rebuild that silently drops a family or mis-joins the taxonomy fails here.
lost_sales_model:
  min_rows: 1000
  max_billed_delta_eur: 1.0
  max_price_residual_eur: 1.0
  min_distinct_distributors: 18
  years: [2023, 2024, 2025, 2026]
  require_gap_types: [substitution, under_service, catalog_gap]
  max_pms_category_coverage_pct: 40.0
  min_pms_category_coverage_pct: 5.0
  down_trade_verdicts:
    - stable
    - bvp_share_up_volume_held
    - bvp_share_up_volume_lost
    - no_bvp_in_market
    - insufficient_years
    - pre_bvp_entry

lost_sales_market:
  min_rows: 40

lost_sales_competitor_coverage:
  min_rows: 2
  max_median_index: 5.0
  min_median_index: 1.0
  require_sources: [KS trade (GBP to EUR), multi-brand bridge]

lost_sales_pn_action:
  min_rows: 50
  levers:
    - price_or_incentive_actionable
    - below_margin_floor
    - landed_cost_not_price
    - insufficient_pricing_data

distributor_geo:
  min_rows: 15

parts_catalog_dimension:
  min_rows: 100000
  min_registry_with_fig_key: 35
  min_with_fig_key: 150000
  min_fig_key_pct: 95.0

sales_by_db_fig_key_year:
  min_rows: 50
  min_mapped_fig_key_rows: 10

ituk_pms_pn_audit:
  min_rows: 10
  distributor_code: ITUK
  required_columns:
    - year
    - distributor_code
    - pms_category
    - part_number
    - pms_type
    - actual_qty
    - share_of_category_qty
  oil_filter_min_pns: 3

required_raw:
  - raw/sales/CY2023-2024.XLSX
  - raw/sales/CY2024-2025.XLSX
  - raw/sales/sales_2026tillApril.XLSX
  - raw/reference/BVP PARTS CATALOG.xlsx
