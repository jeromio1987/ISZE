# ISZE BPR deck generator - theme definitions
#
# charcoal = the I Motors / Astara look: dark background, red and amber accents.
# light    = the house style used on shared white decks.
#
# Colours are written without the leading '#'. Blank means "inherit the theme default"
# (charcoal panels have a border, light panels do not).

charcoal:
  label: "Charcoal (dark)"
  note: "The I Motors / Astara look. Dark background, red and amber accents."
  bg: "262626"            # slide background
  panel: "303030"         # card / panel fill
  row2: "2B2B2B"          # alternating table row
  border: "6E6E6E"        # panel border
  rule: "575757"          # the thin line above the footer
  ink: "F2F2F2"           # main text
  muted: "BDBDBD"         # secondary text
  faint: "8C8C8C"         # footer / source text
  grid: "4D4D4D"          # chart gridlines
  header_fill: "3A3A3A"   # table header row fill
  on_header: "BDBDBD"     # text on the table header row
  accent: "E30613"        # primary accent (red)
  amber: "F5A000"         # secondary accent
  green: "31A354"         # good
  grey: "B7B7B7"          # neutral series
  on_accent: "F2F2F2"     # text on an accent-filled shape
  logo: "white"           # resolved through paths.py (LOGO_WHITE / LOGO_RED)
  font: "Aptos"

light:
  label: "Light (house style)"
  note: "White background, the style used on shared decks."
  bg: "FFFFFF"
  panel: "F4F6F8"
  row2: "EDF1F4"
  border: ""
  rule: "C8CFD6"
  ink: "1A1A1A"
  muted: "5A6472"
  faint: "7D8794"
  grid: "DDE3E8"
  header_fill: "1A2B4A"
  on_header: "FFFFFF"
  accent: "CC0E1E"
  amber: "E08A00"
  green: "1E7B3C"
  grey: "8A939E"
  on_accent: "FFFFFF"
  logo: "red"
  font: "Calibri"
