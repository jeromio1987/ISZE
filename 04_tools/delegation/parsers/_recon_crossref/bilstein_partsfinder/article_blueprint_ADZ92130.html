                    <h4>Vehicle Repairs. We&#39;ve Got What It Takes.</h4>
                    
                
                    
                    <p>Oil is the lifeblood of an engine, with engines relying on clean oil circulating under pressure to lubricate and prevent metal-to-metal contact of bearings and cam gear. The oil also aids cooling by carrying heat away from the pistons, cylinders and turbochargers.</p>
                
                    
                    <p>Most vehicle manufacturers make oil change interval recommendations based on ‘normal’ driving conditions. However, frequent cold starts and short journeys mean the oil does not reach the temperatures required for combustion residue contaminants such as moisture and unburnt fuel to evaporate, which significantly reduces oil quality and necessitates more frequent changes.</p>
                
                    
                    <p>Direct injection petrol engines also produce particulates, which get into the oil and form deposits on vital engine components, so oil quality and filtration is very important.</p>
                
                    
                    <p>Oil relies on the filter to trap the microscopic wear particles and contaminants circulating within the oil and prevent them from becoming embedded into the bearing surfaces.</p>
                
            </div>
        </div>
    
        
        <div class="row quality-statements">
            <div class="col-lg-6">
                
                    <h4>Oil – Only as good as the filter looking after it...</h4>
                    
                    
                
                    
                    <p>Blue Print has a comprehensive range of oil filters in tested OEM quality. Best possible filtration performance guarantees constant optimised engine operation. Oil filters from Blue Print meet or exceed the requirements of the vehicle manufacturers.</p>
                    
                
                    
                    <p>Regular oil and filter changes extend the service life of the engine. A quality filter must have the capacity and efficiency to reliably protect the engine from contamination between today&#39;s usual maintenance intervals.</p>
                    
                
            </div>
            <div class="col-lg-6">
                
                    <h4>Maintenance Packages: Service Solutions for Professionals</h4>
                    
                    
                
                    
                    <p>Alongside individual components for professional vehicle inspections, Blue Print also offers complete maintenance packages. These contain all of the relevant components, with the exception of fluids.</p>
                    
                
                    
                    <p>These components include the oil filter, air filter, fuel filter and cabin filters, and all necessary sealing rings are included in the Blue Print maintenance packages.</p>
                    
                
            </div>
