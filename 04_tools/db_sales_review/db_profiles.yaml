# ISZE Distributor Sales Review — per-DB profile registry
#
# Every constant that used to be re-discovered by hand for each deck lives here.
# All values verified against source on 2026-07-29 unless a later date is noted.
# Add a DB by copying a block and filling it in; run `python preflight.py --db <KEY>`
# to check every field resolves before building anything.
#
# Field notes
#   payer          exact string in cy2025_raw.csv 'DB' and cy2026_q1.csv 'Payer.1'
#   sold_to        SAP sold-to code — REQUIRED filter in load_sales when set
#                  (Israel: 1797=UMI, 1799=UTI; payer name alone blends both)
#   gps_key        row key in 00_derived/gps_master.csv (column 'Unnamed: 0')
#   pms_code       distributor_code in 00_derived/pms_capture_by_db_year.csv
#   fy27_tab       tab in 01_data/ISZE_GPS_Extended_Target_FY27_V3.1.xlsx
#   ids_code       'Country' value in IDS_2026_TOTAL_ranking_all.xlsx; null = no IDS data
#   uio_rows       '1.UIO Overview' row numbers in 06_uio/_CURRENT (ld / md / f_series / lcv)
#   warranty_cy2025_claim   from 01_data/06_Warranty/Warranty_CY2025_by_DB.md, CLAIM price basis
#                           (ISZE-net is roughly x0.74 — the report applies that itself)
#   pbi            official Power BI quarter. Leave null until Jerome supplies the cut;
#                  the deck refuses to build the sales-review slide without it.
#   watch          per-DB caveats lifted from the FY27 workbook's own GAPS block.
#                  These are printed by preflight and must be read before presenting.

defaults:
  # shared across every DB — change here, not per profile
  price_increase_fy27: 0.05
  stretch_pct: 0.02
  additional_growth_fy27: 0.018
  rate_ld: 775.95           # v9 CV rate +5%
  rate_md: 931.35
  rate_f_series: 931.35
  rate_lcv: 230.5430        # MH LCV chain 291.2 x 1.16 x 0.65, +5%
  rate_lcv_base: 219.5648
  # Calendar H1 = Jan–Jun (Q1+Q2). NOT fiscal H1.
  # CY2026 H1 = cy2026_q1.csv (Jan–Mar) + q1fy2027_billing_tagged.csv (Apr–Jun).
  # preflight re-verifies completeness per DB against the canonical FY billing figure.
  window_prior: ["2025-01-01", "2025-07-01"]
  window_current: ["2026-01-01", "2026-07-01"]
  window_label_prior: "CY H1 2025"
  window_label_current: "CY H1 2026"

