        },
        {
          "source_id": "older_tenders",
          "rows": [],
          "selection": "dataset=tender",
          "method": "Different older population; excluded from the case headline."
        }
      ],
      "raw_facts": {
        "paper_snapshot_date": "2026-09-22",
        "paper_snapshot": {
          "notices": 689,
          "opportunities": 619,
          "aftersales": 286,
          "queue": 199,
          "due_14_days": 45,
          "outcomes": 0
        },
        "older_attached_population": 376,
        "current_due_count": null,
        "current_outcome_count": null
      }
    }
  ],
  "validation": {
    "status": "Calculation checks passed; source limitations remain open",
    "computed_case_ids": [
      "AC-01",
      "AC-02",
      "AC-03"
    ],
    "secondary_or_missing_case_ids": [
      "AC-04",
      "AC-05",
      "AC-06"
    ],
    "checks": [
      "Six cases, all initially unassigned and undated.",
      "All monetary headlines in computed cases derived from selected source rows.",
      "Genuine plus BVP reconciles to total on all selected mix rows.",
      "Full calendar 2024 and 2025 used; no partial-2026 growth comparisons.",
      "ITUK and IUK remain separate; no cross-distributor dealer view.",
      "Germany service rate uses its own expected units; fleet bases are not blended.",
      "Out-of-range service percentages are withheld, not capped.",
      "No dealer coverage, dealer year-on-year attribution or price causality inferred.",
      "No primary-ledger zero or current tender count inferred from missing files.",
      "Portugal clutch case excluded; no unvalidated family concession rates published.",

    ],
    "pdf_extraction_errors": []

}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('case-data').textContent);
const CASES = DATA.cases;
const SOURCE = Object.fromEntries(DATA.sources.map(s=>[s.id,s]));
const KEY = 'isuzu-universe-action-centre-v1-review';
const REVIEW_KEY = KEY+'-date';
const IDS = new Set(CASES.map(c=>c.id));
const FINGERPRINT = DATA.sources.filter(s=>s.sha256).map(s=>s.sha256).join('|');
const STATUSES=['Not started','In review','Waiting for evidence','Action in progress','Closed'];
const OUTCOMES=['No action after review','Evidence received','Action completed - impact not measured','Inconclusive','Measured change recorded','Tender won','Tender lost','Tender declined'];
let currentView='centre', evidenceFilter='all', marketFilter='all', searchTerm='', activeId=null, activeTab='evidence';
let persistent=true, reviewState={}, reviewDate=DATA.created_at;
let toastTimer;
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(name,size=16){const paths={info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',person:'<circle cx="12" cy="8" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.info}</svg>`;}
function format(v,kind='eur',digits){
 if(v===null||v===undefined||!Number.isFinite(Number(v)))return 'Not available';
 const n=Number(v), d=digits===undefined?(kind.startsWith('pct')?1:0):digits;
 const abs=new Intl.NumberFormat('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Math.abs(n));
 if(kind==='eur')return (n<0?'\u2212':'')+'\u20ac'+abs;
 if(kind==='eur_signed')return (n<0?'\u2212':n>0?'+':'')+'\u20ac'+abs;
 if(kind==='pct'||kind==='pct_signed')return (n<0?'\u2212':n>0&&kind==='pct_signed'?'+':'')+abs+'%';
 return new Intl.NumberFormat('en-GB',{maximumFractionDigits:d}).format(n);
}
function dateLabel(v){if(!v)return 'Not set';const d=new Date(v+'T12:00:00');return Number.isNaN(d.valueOf())?v:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(d.valueOf())&&d.toISOString().slice(0,10)===v;}
function defaultRecord(c){return {owner:'',due_date:'',status:'Not started',action:c.next_action,notes:'',checks:Array(c.checks.length).fill(false),outcome:null,activity:[]};}
function record(c){return {...defaultRecord(c),...(reviewState[c.id]||{})};}
function isOverdue(c){const r=record(c);return !!r.owner.trim()&&!!r.due_date&&r.due_date<reviewDate&&r.status!=='Closed';}
function ownerCount(){return CASES.filter(c=>record(c).owner.trim()).length;}
function outcomeCount(){return CASES.filter(c=>record(c).outcome).length;}
function badge(e){const names={measured:'MEASURED',partial:'MODELLED / PARTIAL',missing:'MISSING'};return `<span class="tag ${e}"><span class="dot"></span>${names[e]}</span>`;}
function note(text,kind='neutral'){return `<div class="notice ${kind}">${icon('info')}<span>${text}</span></div>`;}
function snapshotLine(c){const v=c.raw_facts?.paper_snapshot?.due_14_days;return c.id==='AC-06'&&v!==undefined?`<div class="card-snapshot">${format(v,'integer')} due within 14 days in the ${dateLabel(c.raw_facts.paper_snapshot_date)} snapshot.</div>`:'';}
function toast(message,error=false){const e=$('#toast');e.textContent=message;e.classList.toggle('error',error);e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,5000);}
function storageNotice(){const e=$('#storage-indicator');e.innerHTML=`<span class="dot"></span>${persistent?'Local browser storage':'Session only - export to keep'}`;e.style.color=persistent?'var(--teal)':'var(--amber)';}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({fingerprint:FINGERPRINT,state:reviewState}));localStorage.setItem(REVIEW_KEY,reviewDate);}catch(e){persistent=false;storageNotice();}}
function sanitizeState(input){
 if(!input||typeof input!=='object'||Array.isArray(input))throw Error('Invalid review-state object.');
 const out={};
 for(const [id,r] of Object.entries(input)){
  if(!IDS.has(id)||!r||typeof r!=='object'||Array.isArray(r))throw Error('Unrecognised case in review file.');
  const c=CASES.find(c=>c.id===id);const a=defaultRecord(c);
  for(const k of ['owner','due_date','status','action','notes']){
   if(r[k]!==undefined){if(typeof r[k]!=='string'||r[k].length>10000)throw Error('Invalid '+k+' field.');a[k]=r[k];}
  }
  if(!STATUSES.includes(a.status))throw Error('Invalid case status.');
  if(a.due_date&&!validDate(a.due_date))throw Error('Invalid due date.');
  if(a.status!=='Not started'&&!a.owner.trim())throw Error('An active case needs an owner.');
  if(Array.isArray(r.checks))a.checks=c.checks.map((_,i)=>r.checks[i]===true);
  if(r.outcome){
   const o=r.outcome;if(typeof o!=='object'||!OUTCOMES.includes(o.type))throw Error('Invalid outcome.');
   a.outcome={};for(const k of ['type','summary','source','period','amount','saved_at']){if(o[k]!==undefined&&typeof o[k]!=='string')throw Error('Invalid outcome field.');a.outcome[k]=String(o[k]||'').slice(0,10000);}
   if(!a.outcome.summary.trim())throw Error('An outcome needs an explanation.');
   if(a.outcome.type==='Measured change recorded'&&(!a.outcome.source.trim()||!a.outcome.period.trim()))throw Error('A measured change needs its source and scope.');
   if(a.outcome.amount!==''&&(!Number.isFinite(Number(a.outcome.amount))||!a.outcome.source.trim()||!a.outcome.period.trim()))throw Error('A euro amount needs a valid number, source and scope.');
   if(!a.owner.trim())throw Error('An outcome needs an assigned owner.');
  }
  if(a.status==='Closed'&&!a.outcome)throw Error('A closed case needs an outcome.');
  if(Array.isArray(r.activity))a.activity=r.activity.slice(-100).map(x=>({at:String(x.at||'').slice(0,40),text:String(x.text||'').slice(0,1000)}));
  out[id]=a;
 }
 return out;
}
try{
 const saved=localStorage.getItem(KEY);if(saved){const x=JSON.parse(saved);if(x.fingerprint===FINGERPRINT)reviewState=sanitizeState(x.state);}
 const d=localStorage.getItem(REVIEW_KEY);if(d&&validDate(d))reviewDate=d;
 const test=KEY+'-probe';localStorage.setItem(test,'1');localStorage.removeItem(test);
}catch(e){persistent=false;reviewState={};}
$('#review-date').value=reviewDate;storageNotice();
$('#review-date').addEventListener('change',e=>{if(validDate(e.target.value)){reviewDate=e.target.value;saveState();render();}});
function footer(){return `<footer class="main-foot"><span>ISUZU UNIVERSE &nbsp;/&nbsp; INTERNAL ISZE REVIEW &nbsp;/&nbsp; ${esc(DATA.app_version)}</span><span>Created ${dateLabel(DATA.created_at)}. Sources keep their own dates. No live refresh.</span></footer>`;}
function hero(title,subtitle,eyebrow='Isuzu Motors Europe / Parts intelligence'){return `<div class="hero"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="hero-right"><span class="pill">${dateLabel(DATA.created_at)} edition</span><span class="tiny muted">A working review, not a forecast</span></div></div>`;}
function counters(){const due=CASES.filter(isOverdue).length;return `<div class="summary-bar"><div class="summary-cell"><b>${CASES.length}</b><span>cases</span></div><div class="summary-cell unowned"><b>${ownerCount()}</b><span>owners assigned</span></div><div class="summary-cell"><b>${outcomeCount()}</b><span>outcomes in this mock</span></div>${due?`<div class="summary-cell unowned"><b>${due}</b><span>overdue at review date</span></div>`:''}<div class="summary-note">Ownership is intentionally empty on first use. Assign it before work starts.</div></div>`;}
function card(c){const r=record(c),value=c.headline_text||format(c.headline.value,c.headline.format),neg=typeof c.headline.value==='number'&&c.headline.value<0;
 return `<article class="case-card" data-id="${c.id}"><div class="card-content"><div class="card-meta"><span class="case-id">${c.id}</span>${badge(c.evidence)}</div><div class="card-market">${esc(c.market)}</div><h3>${esc(c.title)}</h3><div class="card-number ${c.headline_text?'text-value':''} ${neg?'negative':''}">${esc(value)}</div><div class="card-label">${esc(c.headline.label)}${c.headline.kind==='reported'?' &middot; paper only':''}</div>${snapshotLine(c)}<p class="card-summary">${esc(c.summary)}</p><div class="card-period">${esc(c.period)}${c.context_line?'<br>'+esc(c.context_line):''}</div></div><div class="card-bottom"><div><div class="owner ${r.owner.trim()?'assigned':''}">${icon('person',12)}${esc(r.owner.trim()||'Owner unassigned')}</div><div class="card-status">${esc(isOverdue(c)?'Overdue at review date':r.status)}</div></div><button class="btn small ghost open-case" data-id="${c.id}" aria-label="Open ${esc(c.title)} review">Review ${icon('arrow',13)}</button></div></article>`;
}
function selectedCases(){const query=searchTerm.toLowerCase().trim();return CASES.filter(c=>(evidenceFilter==='all'||c.evidence===evidenceFilter)&&(marketFilter==='all'||c.market===marketFilter)&&(!query||[c.title,c.market,c.summary,c.case_type,c.id].join(' ').toLowerCase().includes(query)));}
function renderCards(){const e=$('#cards');if(!e)return;const arr=selectedCases();e.innerHTML=arr.length?arr.map(card).join(''):`<div class="empty" style="grid-column:1/-1">No cases match these filters. Clear the search or change the evidence filter.</div>`;bindOpen(e);const count=$('#shown-count');if(count)count.textContent=arr.length+' of '+CASES.length+' cases';}
function renderCentre(){
 const markets=[...new Set(CASES.map(c=>c.market))];
 $('#main').innerHTML=hero('Action Centre','Decide what happens next. Open the evidence, assign an owner and record the result.')+counters()+
 note(`<strong>${DATA.validation.computed_case_ids.length} cases are calculated from attached extracts.</strong> Concession evidence, the programme ledger and the current tender feed are missing. Their cards stay open as validation tasks. <button class="table-link" data-jump="sources">See sources &amp; limits &rarr;</button>`)+
 `<div class="toolbar"><div class="filters" aria-label="Evidence filters">${[['all','All cases'],['measured','Measured'],['partial','Modelled / partial'],['missing','Missing']].map(([k,t])=>`<button class="filter ${evidenceFilter===k?'active':''}" data-filter="${k}" aria-pressed="${evidenceFilter===k}">${t}</button>`).join('')}</div><div class="inputs"><select id="market-filter" aria-label="Filter by distributor or scope"><option value="all">All internal scopes</option>${markets.map(m=>`<option value="${esc(m)}" ${marketFilter===m?'selected':''}>${esc(m)}</option>`).join('')}</select><div class="searchbox">${icon('search')}<input id="case-search" type="search" placeholder="Search cases" value="${esc(searchTerm)}" aria-label="Search cases"></div></div></div><div class="card-grid" id="cards"></div><p id="shown-count" class="tiny muted" style="margin-top:14px"></p>`+footer();
 renderCards();$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{evidenceFilter=b.dataset.filter;renderCentre();}));$('#market-filter').addEventListener('change',e=>{marketFilter=e.target.value;renderCards();});$('#case-search').addEventListener('input',e=>{searchTerm=e.target.value;renderCards();});bindJumps();
}
function renderSources(){
 const computed=DATA.validation.computed_case_ids.length,blocked=DATA.validation.secondary_or_missing_case_ids.length;
 $('#main').innerHTML=hero('Sources &amp; limits','Every headline has a source, a scope and a boundary. Unavailable files stay visible.','Understand / provenance and calculation')+
 note('This HTML file contains internal multi-market information. It has no authentication or access-control layer. A market filter is not a permission boundary. Do not circulate it to distributors.','warning')+
 `<div class="section-grid"><div class="panel"><div class="eyebrow">Recomputed from selected extracts</div><div class="big-stat">${computed} cases</div><p>ITUK brake pads, Germany oil filters and IUK air-filter mix. These calculations do not validate dealer demand, account routing or price causality.</p></div><div class="panel"><div class="eyebrow">Primary evidence still missing</div><div class="big-stat">${blocked} cases</div><p>Concession review, programme credits and tenders. Document-reported values are explicitly labelled. Blank evidence is never turned into a zero.</p></div></div>`+
 `<div class="notice neutral"><span><strong>Evidence labels describe the displayed facts, not permission to act.</strong> MEASURED means purchasing computed from the selected extract. MODELLED / PARTIAL covers a modelled denominator, a secondary document or an unresolved basis. MISSING means a required source is not supplied. None automatically authorises a price change.</span></div>`+
 `<h3 style="margin:24px 0 13px">Source register</h3><div class="source-list">${DATA.sources.map(s=>`<article class="source-row"><div class="source-row-top"><div><div class="source-name">${esc(s.name)}</div><div class="source-role">${esc(s.role)}</div></div><span class="tag ${s.available?'measured':'missing'}">${s.available?'ATTACHED':'NOT SUPPLIED'}</span></div><p>${esc(s.note)}</p>${s.period?`<div class="tiny muted">Scope: ${esc(s.period)}${s.snapshot_date?' &middot; snapshot '+dateLabel(s.snapshot_date):''}</div>`:''}${s.sha256?`<details><summary>File fingerprint for reproducibility</summary><div class="mono">SHA-256: ${s.sha256}</div></details>`:''}</article>`).join('')}</div>`+
 `<h3 style="margin:27px 0 13px">Calculation checks</h3><div class="panel">${DATA.validation.checks.map(t=>`<div class="check-line">${icon('check',14)}<span>${esc(t)}</span></div>`).join('')}</div>`+
 `<div class="source-controls"><button class="btn" id="export-source">Export case file</button><button class="btn ghost danger" id="clear-review">Clear local decisions</button></div>`+footer();
 $('#export-source').addEventListener('click',exportFile);$('#clear-review').addEventListener('click',()=>{if(confirm('Clear owners, dates, notes and outcomes stored by this mock? Source facts will not change.')){reviewState={};saveState();render();toast('Local decisions cleared. Source facts are unchanged.');}});
}
function renderActions(){
 $('#main').innerHTML=hero('Action register','Ownership is the next decision. No names or due dates have been invented.','Do / responsibility and follow-through')+counters()+
 note(`Due-date checks use the review date: <strong>${dateLabel(reviewDate)}</strong>. An action is overdue only when an owner and a due date are recorded. This file does not send reminders or contact distributors.`)+
 `<div class="table-wrap"><table><thead><tr><th>Case / scope</th><th>Next action</th><th>Owner</th><th>Due date</th><th>Status</th><th></th></tr></thead><tbody>${CASES.map(c=>{const r=record(c);return `<tr><td style="min-width:160px"><button class="table-link open-case" data-id="${c.id}">${esc(c.title)}</button><div class="sub">${c.id} &middot; ${esc(c.market)}</div></td><td style="min-width:230px;max-width:420px">${esc(r.action)}</td><td style="min-width:120px"><span class="owner ${r.owner.trim()?'assigned':''}">${esc(r.owner||'Unassigned')}</span></td><td style="min-width:105px">${r.due_date?dateLabel(r.due_date):'<span class="muted">Not set</span>'}${isOverdue(c)?'<div class="sub" style="color:var(--amber)">Overdue</div>':''}</td><td style="min-width:120px">${esc(r.status)}</td><td><button class="btn small open-case" data-id="${c.id}" data-tab="action">Assign / edit</button></td></tr>`;}).join('')}</tbody></table></div>`+footer();bindOpen();
}
function renderResults(){const done=CASES.filter(c=>record(c).outcome);
 $('#main').innerHTML=hero('Results','Record what changed, what did not, and what remains unknown.','Learn / outcomes before claims')+
 note('Results entered here are reviewer records, not independently verified measurements. A before-and-after increase is not automatically caused by an intervention. No financial return is summed across these cases.')+
 (done.length?`<div class="table-wrap"><table><thead><tr><th>Case</th><th>Recorded outcome</th><th>Explanation</th><th>Evidence / scope</th><th></th></tr></thead><tbody>${done.map(c=>{const o=record(c).outcome;return `<tr><td>${esc(c.title)}<div class="sub">${esc(c.market)}</div></td><td>${esc(o.type)}<div class="sub">Reviewer-recorded</div></td><td style="max-width:350px">${esc(o.summary)}${o.amount!==''?`<div class="sub">Entered amount: ${format(Number(o.amount),'eur_signed')} &middot; not independently verified</div>`:''}</td><td>${esc(o.source||'No source reference entered')}<div class="sub">${esc(o.period||'No comparison period entered')}</div></td><td><button class="btn small open-case" data-id="${c.id}" data-tab="outcome">Review</button></td></tr>`;}).join('')}</tbody></table></div>`:
 `<div class="results-empty"><div class="eyebrow" style="margin-bottom:13px">No outcomes recorded in this mock</div><h3>An empty result is not a failed campaign.</h3><p>No intervention has been completed or evaluated in this file yet. The result can be a measured change, a completed evidence request, an inconclusive review, or a decision not to act. Record the basis before closing a case.</p><button class="btn" data-jump="actions" style="margin-top:21px">Open action register ${icon('arrow',14)}</button></div>`)+footer();bindOpen();bindJumps();}
function render(){const fn={centre:renderCentre,sources:renderSources,actions:renderActions,results:renderResults};fn[currentView]();$$('.nav-item').forEach(b=>{b.classList.toggle('active',b.dataset.view===currentView);b.setAttribute('aria-current',b.dataset.view===currentView?'page':'false');});}
function navigate(v){currentView=v;render();window.scrollTo(0,0);}
function bindJumps(root=document){$$('[data-jump]',root).forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.jump)));}
function bindOpen(root=document){$$('.open-case',root).forEach(b=>b.addEventListener('click',()=>openCase(b.dataset.id,b.dataset.tab||'evidence')));}
$$('.nav-item').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
function metricBox(m){return `<div class="metric"><div class="metric-label">${esc(m.label)}</div><div class="metric-value">${format(m.value,m.format)}</div><div class="metric-basis">${esc(m.basis)}</div><div class="metric-kind ${m.kind}">${esc(m.kind==='reported'?'Paper-reported':m.kind==='modelled'?'Modelled':'Measured in selected extract')}</div></div>`;}
function chartHtml(c){const x=c.chart;if(!x)return '';let content='';if(x.type==='comparison'){
 const max=Math.max(...x.series.map(s=>s.value),1);content=x.series.map((s,i)=>`<div class="bar-line"><div class="bar-label"><span>${esc(s.label)}</span><strong>${format(s.value,x.format)}</strong></div><div class="bar-track"><div class="bar-fill ${i?'recent':''}" style="width:${s.value/max*100}%"></div></div></div>`).join('');
 }else if(x.type==='stacked'){
 const max=Math.max(...x.series.map(s=>s.genuine+s.bvp),1);content='<div class="legend"><span><i class="swatch"></i>Genuine</span><span><i class="swatch bvp"></i>BVP</span></div>'+x.series.map(s=>`<div class="bar-line"><div class="bar-label"><span>${esc(s.label)}</span><strong>${format(s.genuine+s.bvp,x.format)}</strong></div><div class="bar-track"><div class="bar-fill genuine" style="width:${s.genuine/max*100}%" title="Genuine ${format(s.genuine)}"></div><div class="bar-fill bvp" style="width:${s.bvp/max*100}%" title="BVP ${format(s.bvp)}"></div></div><div class="bar-label" style="margin-top:6px;font-size:10px"><span>Genuine ${format(s.genuine)}</span><span>BVP ${format(s.bvp)}</span></div></div>`).join('');
 }else if(x.type==='coverage'){
 content=x.value===null?'<p class="muted">Rate withheld: the denominator requires review.</p>':`<div class="coverage-number">${format(x.value,'pct')}</div><div class="bar-track"><div class="bar-fill bvp" style="width:${x.value}%"></div></div><div class="bar-label" style="margin-top:9px"><span>Measured purchasing</span><span>Modelled expectation</span></div>`;
 }return `<section class="chart" aria-label="${esc(x.title)}"><h4>${esc(x.title)}</h4>${content}<p class="chart-caption">${esc(x.caption)}</p></section>`;
}
function refs(c){return `<details class="refbox"><summary>Source rows and calculation method</summary>${c.references.map(r=>{const s=SOURCE[r.source_id];return `<div class="reference"><div class="reference-title">${esc(s?.name||r.source_id)} ${s?.available?'':'<span class="tag missing">NOT SUPPLIED</span>'}</div><p>${esc(r.selection)}${r.rows.length?' &middot; CSV rows '+r.rows.join(', ')+' (header is row 1)':''}</p><p>${esc(r.method)}</p></div>`;}).join('')}</details>`;}
function evidencePanel(c){
 const auditOnly=['AC-04','AC-05','AC-06'].includes(c.id);
 return `${auditOnly?note(c.id==='AC-04'?'This card is a validation task. No concession rates are released.':c.id==='AC-05'?'The credit amount is paper-reported. The ledger is missing; the amount and case count have not been independently reconciled.':'This is the 22 September 2026 paper snapshot, not a refreshed tender feed. Current counts are unavailable.','warning'):''}`+
 (c.metrics.length?`<div class="metrics">${c.metrics.map(metricBox).join('')}</div>`:'')+
 `<div class="evidence-layout"><div class="evidence-main">${chartHtml(c)}<section class="panel"><h4 style="margin-bottom:14px">What the evidence supports</h4><div class="facts">${c.facts.map(p=>`<p>${esc(p)}</p>`).join('')}</div></section>${refs(c)}</div><div class="evidence-side"><section class="panel"><h4>Interpretation</h4><p>${esc(c.interpretation)}</p></section><section class="panel"><h4 style="color:var(--amber)">Not established</h4><p>${esc(c.limitation)}</p></section><section class="panel next-panel"><div class="eyebrow" style="margin-bottom:8px">Next action</div><p>${esc(record(c).action)}</p><button class="btn primary" id="evidence-to-action">Assign owner ${icon('arrow',14)}</button></section></div></div>`;
}
function activityHtml(r){if(!r.activity.length)return '<p class="muted tiny">No review activity recorded yet.</p>';return r.activity.slice(-6).reverse().map(a=>`<div class="activity-entry"><time>${esc(new Date(a.at).toLocaleString('en-GB'))}</time>${esc(a.text)}</div>`).join('');}
function actionPanel(c){const r=record(c);return `<div class="form-layout"><form id="action-form"><div id="action-error" class="form-error" hidden></div><div class="form-grid"><div class="field"><label for="owner">Owner</label><input id="owner" name="owner" placeholder="Assign a person or role" value="${esc(r.owner)}" maxlength="200"><span class="hint">No owner has been assigned automatically.</span></div><div class="field"><label for="due-date">Due date</label><input id="due-date" name="due" type="date" value="${esc(r.due_date)}"><span class="hint">No deadline is assumed.</span></div></div><div class="field"><label for="case-status">Review status</label><select id="case-status">${STATUSES.map(s=>`<option ${r.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select><span class="hint">Starting work requires an owner. Closing requires a recorded outcome.</span></div><div class="field"><label for="next-action">Next action</label><textarea id="next-action" rows="4" maxlength="10000">${esc(r.action)}</textarea></div><div class="field"><label for="action-notes">Review notes</label><textarea id="action-notes" rows="3" placeholder="Record what was agreed, not what the data cannot prove." maxlength="10000">${esc(r.notes)}</textarea></div><div class="form-actions"><button class="btn primary" type="submit">Save action</button><button class="btn ghost" type="button" id="action-to-outcome">Record outcome ${icon('arrow',13)}</button><span id="action-saved" class="saved-status" aria-live="polite"></span></div><p class="tiny muted" style="margin-top:15px">Edits remain local to this browser. Export the case file to preserve or transfer the review. No email is sent.</p></form><aside><section class="panel"><h4>Evidence checklist</h4><p class="tiny muted" style="margin:8px 0">These are reviewer confirmations. Ticking a box does not validate or recalculate source metrics.</p>${c.checks.map((v,i)=>`<label class="check-item"><input type="checkbox" class="review-check" data-index="${i}" ${r.checks[i]?'checked':''}><span>${esc(v)}</span></label>`).join('')}</section><section class="panel" style="margin-top:16px"><h4 style="margin-bottom:15px">Activity in this mock</h4>${activityHtml(r)}</section></aside></div>`;}
function outcomePanel(c){const r=record(c),o=r.outcome||{type:'',summary:'',source:'',period:'',amount:''};const options=c.id==='AC-06'?OUTCOMES:OUTCOMES.filter(v=>!v.startsWith('Tender'));
 return note('An outcome is a reviewer record. A measured change needs a dated source and a like-for-like comparison scope. It is not automatically an incremental profit claim.')+
 `<div class="form-layout"><form id="outcome-form"><div id="outcome-error" class="form-error" hidden></div><div class="field"><label for="outcome-type">Outcome</label><select id="outcome-type" required><option value="">Select an outcome</option>${options.map(v=>`<option ${v===o.type?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label for="outcome-summary">What happened, and what decision changed?</label><textarea id="outcome-summary" rows="4" required maxlength="10000" placeholder="A decision not to lower price is a valid result. State the evidence.">${esc(o.summary)}</textarea></div><div class="field"><label for="outcome-source">Evidence reference</label><input id="outcome-source" maxlength="1000" placeholder="Source file / case / dated confirmation" value="${esc(o.source)}"><span class="hint">Required for a measured change. This is a reference, not a file upload.</span></div><div class="form-grid"><div class="field"><label for="outcome-period">Period and comparison scope</label><input id="outcome-period" maxlength="1000" placeholder="Same families, channel and periods" value="${esc(o.period)}"></div><div class="field"><label for="outcome-amount">Documented euro change (optional)</label><input id="outcome-amount" type="number" step="0.01" placeholder="Leave blank unless documented" value="${esc(o.amount)}"><span class="hint">Not automatically labelled revenue, profit or causal return.</span></div></div><label class="check-item" style="border:0;margin-bottom:12px"><input id="close-after-save" type="checkbox" ${r.status==='Closed'?'checked':''}><span>Close the case after recording this outcome.</span></label><div class="form-actions"><button class="btn primary" type="submit">Save outcome</button><span id="outcome-saved" class="saved-status" aria-live="polite"></span></div></form><aside><section class="panel"><h4>Keep the distinction</h4><p style="margin-top:12px"><strong>Observed change</strong> tells us what moved.</p><p style="margin-top:12px"><strong>Incremental effect</strong> needs a defensible baseline, comparable periods and adjustment for other changes.</p><p style="margin-top:12px"><strong>Programme return</strong> needs the associated costs and support, without counting the same gain twice.</p></section><section class="panel" style="margin-top:16px"><h4>Current responsibility</h4><p style="margin-top:10px">Owner: <strong>${esc(r.owner||'Unassigned')}</strong><br>Status: ${esc(r.status)}</p>${!r.owner?'<button class="btn" id="outcome-to-action" style="margin-top:15px">Assign owner first</button>':''}</section></aside></div>`;
}
function openCase(id,tab='evidence'){
 const c=CASES.find(c=>c.id===id);if(!c)return;activeId=id;activeTab=tab;const d=$('#case-dialog');
 d.innerHTML=`<div class="dialog-header"><div class="row"><div><div class="eyebrow">${c.id} / ${esc(c.market)}</div><h2 id="dialog-title">${esc(c.title)}</h2><p class="dialog-subtitle">${esc(c.period)} &middot; ${esc(c.case_type)}</p></div><button class="icon-btn" id="close-dialog" aria-label="Close case review">${icon('close',18)}</button></div><div class="dialog-meta">${badge(c.evidence)}<span class="tiny muted">${esc(c.basis_label)}</span></div></div><div class="tabs" role="tablist" aria-label="Case review stages">${[['evidence','Understand the evidence'],['action','Assign & act'],['outcome','Record result']].map(([key,label])=>`<button class="tab ${tab===key?'active':''}" role="tab" id="tab-${key}" aria-controls="panel-${key}" aria-selected="${tab===key}" data-tab="${key}">${label}</button>`).join('')}</div><div class="dialog-body"><section class="tab-panel" id="panel-evidence" role="tabpanel" aria-labelledby="tab-evidence" ${tab==='evidence'?'':'hidden'}>${evidencePanel(c)}</section><section class="tab-panel" id="panel-action" role="tabpanel" aria-labelledby="tab-action" ${tab==='action'?'':'hidden'}>${actionPanel(c)}</section><section class="tab-panel" id="panel-outcome" role="tabpanel" aria-labelledby="tab-outcome" ${tab==='outcome'?'':'hidden'}>${outcomePanel(c)}</section></div>`;
 $('#close-dialog').addEventListener('click',()=>d.close());$$('.tab',d).forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
 $('#evidence-to-action')?.addEventListener('click',()=>switchTab('action'));
 $('#action-to-outcome').addEventListener('click',()=>switchTab('outcome'));
 $('#outcome-to-action')?.addEventListener('click',()=>switchTab('action'));
 $('#action-form').addEventListener('submit',e=>{e.preventDefault();saveAction(c);});
 $('#outcome-form').addEventListener('submit',e=>{e.preventDefault();saveOutcome(c);});
 if(!d.open)d.showModal();d.scrollTop=0;$('#close-dialog').focus({preventScroll:true});
}
function switchTab(tab){activeTab=tab;$$('.tab',$('#case-dialog')).forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',b.dataset.tab===tab);});$$('.tab-panel',$('#case-dialog')).forEach(p=>p.hidden=p.id!=='panel-'+tab);$('#case-dialog').scrollTop=0;}
function setError(kind,msg){const e=$('#'+kind+'-error');e.textContent=msg;e.hidden=false;e.scrollIntoView({block:'nearest'});}
function saveAction(c){const owner=$('#owner').value.trim(),due=$('#due-date').value,status=$('#case-status').value,action=$('#next-action').value.trim(),notes=$('#action-notes').value.trim();const old=record(c);
 if(status!=='Not started'&&!owner)return setError('action','Assign an owner before starting or closing the review.');
 if(status==='Closed'&&!old.outcome)return setError('action','Record an outcome before closing this case.');
 if(due&&!validDate(due))return setError('action','Enter a valid due date.');
 if(!action)return setError('action','Enter the next action.');
 reviewState[c.id]={...old,owner,due_date:due,status,action,notes,checks:$$('.review-check').map(x=>x.checked),activity:[...old.activity,{at:new Date().toISOString(),text:'Action saved'+(owner?' - owner: '+owner:' - owner still unassigned')}].slice(-100)};
 saveState();render();openCase(c.id,'action');$('#action-saved').textContent=persistent?'Saved locally':'Saved for this session; export to keep';toast('Action saved. No message or assignment was sent externally.');
}
function saveOutcome(c){const r=record(c);if(!r.owner.trim())return setError('outcome','Assign and save an owner in the action tab before recording an outcome.');
 const type=$('#outcome-type').value,summary=$('#outcome-summary').value.trim(),source=$('#outcome-source').value.trim(),period=$('#outcome-period').value.trim(),amount=$('#outcome-amount').value,close=$('#close-after-save').checked;
 if(!type||!summary)return setError('outcome','Select an outcome and explain what happened.');
 if(type==='Measured change recorded'&&(!source||!period))return setError('outcome','A measured change requires both an evidence reference and a comparison period/scope.');
 if(amount!==''&&(!Number.isFinite(Number(amount))||!source||!period))return setError('outcome','A euro amount requires a valid number, a source and a comparison scope.');
 const outcome={type,summary,source,period,amount,saved_at:new Date().toISOString()};
 reviewState[c.id]={...r,outcome,status:close?'Closed':r.status,activity:[...r.activity,{at:new Date().toISOString(),text:'Outcome recorded: '+type+(close?' - case closed':'')}].slice(-100)};
 saveState();render();openCase(c.id,'outcome');$('#outcome-saved').textContent='Reviewer outcome saved locally';toast('Outcome recorded. Source measurements remain unchanged.');
}
$('#case-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
function exportFile(){const payload={...DATA,dataset_fingerprint:FINGERPRINT,review_date:reviewDate,exported_at:new Date().toISOString(),review_state:reviewState};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ISUZU_UNIVERSE_case_review_'+reviewDate+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Case facts and local review records exported. No raw billing is included.');}
$('#export-btn').addEventListener('click',exportFile);
$('#restore-btn').addEventListener('click',()=>$('#restore-input').click());
$('#restore-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('Review file is too large.');const x=JSON.parse(await file.text());if(x.schema_version!==DATA.schema_version||x.dataset_fingerprint!==FINGERPRINT)throw Error('This review belongs to a different source dataset. Restore into the matching HTML edition.');const s=sanitizeState(x.review_state);if(!confirm('Replace the local review with the owners, dates, notes and outcomes in this file? Source values will stay unchanged.'))return;reviewState=s;if(x.review_date&&validDate(x.review_date)){reviewDate=x.review_date;$('#review-date').value=reviewDate;}saveState();render();toast('Review restored. Source values are unchanged.');}catch(err){toast('Restore failed: '+err.message,true);}finally{e.target.value='';}});
render();
</script>
</body>
</html>
