# Isuzu OS data map — capability × data
# Agents: this file is the source of truth. HTML is generated from it
# (02_dashboards/ops/build_os_data_map.py). Do not invent KPIs here.
# Snapshot seeded from DATA_MANIFEST, FACTS, ISZE_ROADMAP,
# roadmaps/ai_sales_intelligence.md, DATA_INTEGRITY_FLAGS_2026-05-28.md,
# 01_data/00_derived/_data_integrity_open_issues.md (2026-08-17).
# Completeness index is a planning catalogue — not FACTS-quotable.

version: 1
snapshot_date: 2026-08-18
title: Isuzu OS data map
audience: ISZE internal (Jerome) — aftersales decision OS in the seat, not a product to sell
purpose: >
  What data the aftersales OS needs to take each decision, what is already wired,
  what is still requestable, and what is closed (do not re-ask). Integrity is an
  overlay on Have/Partial, not a second dashboard.

completeness:
  formula: have / (have + partial + need)
  label: Catalogue completeness
  exclude_from_index: [closed, org]
  not_facts_quotable: true
  tooltip: >
    Have divided by Have + Partial + Need on this catalogue. Snapshot 18 Aug 2026.
    Not a FACTS KPI — a planning index of how much of the requestable OS data is
    already wired. Closed doors and org-scale programmes are excluded.

statuses:
  have:
    label: Have
    meaning: Wired into derived tables and FACTS-quotable when the quote gate is green.
  partial:
    label: Partial
    meaning: Some distributors, years, or joins only — usable with a caveat.
  need:
    label: Need
    meaning: Would unlock the capability and is still requestable.
  closed:
    label: Closed
    meaning: Confirmed unavailable or ruled out. Do not re-ask.
  org:
    label: Org
    meaning: Six-to-twelve-month organisational programme. Not on the critical path.

