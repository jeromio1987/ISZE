integrity:
  overlay_not_a_product: true
  quote_guards:
    - id: C
      title: Air-to-oil interval still provisional
      severity: medium
      note: Air factor 0.5 until IML confirms. Capture is directionally comparable across categories, not locked.
    - id: H
      title: Credit-note / return exclusion is a judgment call
      severity: medium
      note: SaTy CR/RE on positive-value lines excluded. Not ERP-confirmed. Reversible. Do not wait on SAP.
    - id: LCV-DEC
      title: LCV claim file ends November 2025
      severity: closed
      note: CLOSED 2026-09-24. The December-2025 hole is filled by WArranty Data LCV_102025_082026.xlsx, which covers AssessMonth 202510–202608. Its overlap with the older exports ties to the euro, and 202605–202608 (5,048 lines / EUR 1,078,462) are months no other file holds. UMI CY2025 stays complete on the dedicated file, and the new export has no Israel rows. What remains open is narrower and is logged as LCV-EXT in 01_data/00_derived/_data_integrity_open_issues.md — nothing published yet reads the last four months.
  fragments:
    - name: PRISM Data Integrity page
      role: Pipeline pass/warn/fail, distributor-code reconcile, mislabelled SKU audit. IA demotes this to Tools.
      path: 03_analytics/Isuzu/prism/pages/10_Data_Integrity.py
    - name: Integrity flag list (28 May 2026)
      role: What is safe to quote. A/B/D/E/F/G closed; C and H still guarded.
      path: 03_analytics/Isuzu/prism/docs/DATA_INTEGRITY_FLAGS_2026-05-28.md
    - name: Open source-gap note (updated 2026-09-24)
      role: LCV-DEC is CLOSED as of 2026-09-24 — the new network-wide LCV export covers to August 2026. What replaced it is LCV-EXT (the last four months are not yet read by anything published) plus LCV-CURRENCY-RULE and MIDI-WARR, both needing a call from Jerome. UMI-WARR and CV-BLANK closed per 27 Jul 2026 warranty sanity.
      path: 01_data/00_derived/_data_integrity_open_issues.md
    - name: Evidence integrity board
      role: UIO coverage and GPS warranty sanity (internal SQL).
      path: 03_analytics/Isuzu/prism/evidence-app/pages/data-integrity.md
    - name: Per-distributor operating-pack holes
      role: Meeting-pack caveats (ITUK, UMI, Germany, Portugal, Greece). Not a network OS map.
      path: 09_meetings/*_Operating_Dashboard_2026/DATA_INTEGRITY.md
    - name: IE40 / Class-0 Excel (ITUK dispute evidence)
      role: March 2026 pricing-quality tracker. Not the OS integrity view. Do not grow it for the Marsh dispute.
      path: 01_data/11_planning/ISZE_DataIntegrity_Dashboard.xlsx
      copies:
        - 91_legacy/Isuzu/ISZE_DataIntegrity_Dashboard.xlsx
  stale_on_page10:
    - Refreshed 2026-08-18. DI-2 names UIO v19; DI-8 names AIM CY2026 shipped 2026-07-02. Duplicate-path cross-check and country-pack vintage labels remain.
  do_not:
    - Clone the Streamlit integrity page into HTML.
    - Rebuild the March 2026 Excel as a fourth integrity product.
    - Treat MASTER_DASHBOARD, the PRISM network map, or DATA_MANIFEST as this OS data map.

