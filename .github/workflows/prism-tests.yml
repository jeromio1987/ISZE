name: PRISM tests

on:
  push:
    paths:
      - '03_analytics/Isuzu/prism/**'
      - '.github/workflows/prism-tests.yml'
  pull_request:
    paths:
      - '03_analytics/Isuzu/prism/**'
      - '.github/workflows/prism-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_analytics/Isuzu/prism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyyaml openpyxl
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run PRISM unit tests
        run: python -m pytest tests/ -q --tb=short
